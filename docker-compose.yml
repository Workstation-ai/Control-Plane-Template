name: ${COMPOSE_PROJECT_NAME:-my-app}

networks:
  app-network:
    driver: bridge

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/your-org/your-app:latest}
    container_name: ${APP_CONTAINER_NAME:-my-app}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    volumes:
      - "./app.env:/app/.env"
      - "./storage:/app/storage"
      - "./data:/app/data"
    env_file:
      - app.env
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${APP_PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: app --interval 3600 --cleanup
    networks:
      - app-network
