#cloud-config
package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - debian-keyring
  - apt-transport-https

runcmd:
  # -- Docker (official repo, includes compose plugin) --
  - curl -fsSL https://get.docker.com | sh
  - systemctl enable docker

  # -- Caddy (auto HTTPS reverse proxy) --
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list > /dev/null
  - apt-get update -qq && apt-get install -y -qq caddy

  # -- Swap (esencial para droplets de 1-2GB RAM) --
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - echo 'vm.swappiness=10' >> /etc/sysctl.conf && sysctl -p

  # -- Firewall --
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow ssh
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # -- App directory --
  - mkdir -p /opt/my-app/storage /opt/my-app/data /opt/my-app/public

  # -- Download compose file from GitHub --
  - curl -s -H "Authorization: token {{GITHUB_TOKEN}}" \
      -H "Accept: application/vnd.github.raw+json" \
      -o /opt/my-app/docker-compose.yml \
      "https://api.github.com/repos/{{GITHUB_ORG}}/{{REPO_NAME}}/contents/docker-compose.yml"
  # Pin to specific version
  - sed -i 's|ghcr.io/your-org/your-app:latest|ghcr.io/{{GITHUB_ORG}}/{{REPO_NAME}}:{{APP_VERSION}}|g' /opt/my-app/docker-compose.yml
  # Fix watchtower for Docker API v1.40+ compatibility
  - sed -i '/^    image: containrrr\/watchtower$/a\    environment:\n      - DOCKER_API_VERSION=1.40' /opt/my-app/docker-compose.yml

  # -- Caddyfile --
  - |
    cat > /etc/caddy/Caddyfile << CADDYEOF
    {{CLIENT_DOMAIN}} {
        reverse_proxy localhost:{{APP_PORT}}
    }
    CADDYEOF

  # -- Generate secrets --
  - cd /opt/my-app
  - JWT_SECRET=$(openssl rand -hex 32)
  - AUTH_TOKEN=$(openssl rand -hex 32)
  - SIG_KEY=$(openssl rand -hex 32)
  - SIG_SALT=$(openssl rand -hex 32)

  # -- Create app.env --
  - |
    cat > /opt/my-app/app.env << EOF
    APP_PORT={{APP_PORT}}
    STORAGE_DIR=/app/storage
    JWT_SECRET=${JWT_SECRET}
    AUTH_TOKEN=${AUTH_TOKEN}
    SIG_KEY=${SIG_KEY}
    SIG_SALT=${SIG_SALT}
    DISABLE_SWAGGER_DOCS=true
    EOF

  # -- Fix permissions --
  - chown -R 1000:1000 /opt/my-app/storage /opt/my-app/data /opt/my-app/public
  - chown 1000:1000 /opt/my-app/app.env /opt/my-app/docker-compose.yml

  # -- Login to ghcr.io (needed for private images) --
  - echo "{{GITHUB_TOKEN}}" | docker login ghcr.io -u {{GITHUB_USER}} --password-stdin

  # -- Pull image --
  - cd /opt/my-app && docker compose pull

  # -- Start container --
  - cd /opt/my-app && docker compose up -d

  # -- Start Caddy --
  - systemctl enable caddy && systemctl restart caddy

  # -- Health check --
  - sleep 25
  - |
    if curl -sf http://localhost:{{APP_PORT}}/health > /dev/null 2>&1; then
      echo "[OK] Application - ONLINE"
      echo "[OK] HTTPS disponible en https://{{CLIENT_DOMAIN}}"
    else
      echo "[WARN] Application - health check FAILED. Check: docker compose logs"
    fi

  # -- Cleanup --
  - docker system prune -f -a
